<title>공룡알 구구단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: full-height app column — top bar, equation card, nest scene (fills the rest), egg progress strip, bottom tab bar. Dex/record scroll inside. */
:root{
  --bg:#eef7ea; --card:#ffffff; --ink:#3d3a2e; --soft:#7f8a6f; --line:#dce8d2; --track:#e6efdc;
  --lava:#f4743b; --lava-d:#d4561f; --lava-soft:#ffe5d6; --leaf:#4fa25a; --leaf-soft:#ddf2dc;
  --sky:#e2f3fb; --gold:#f2b01e; --gold-soft:#fff2c6; --blue:#5b98e0; --blue-soft:#e1edfc;
  --shadow:0 2px 0 rgba(60,80,40,.06),0 8px 22px rgba(60,80,40,.11);
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a2119; --card:#262f25; --ink:#eef3e6; --soft:#a8b69a; --line:#3a4637; --track:#334031;
  --lava:#f4803f; --lava-d:#ffa66e; --lava-soft:#47302a; --leaf:#80cd89; --leaf-soft:#2b3f2c;
  --sky:#2b3a40; --gold:#f5c044; --gold-soft:#463d22; --blue:#83b2ee; --blue-soft:#283748;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a2119; --card:#262f25; --ink:#eef3e6; --soft:#a8b69a; --line:#3a4637; --track:#334031;
  --lava:#f4803f; --lava-d:#ffa66e; --lava-soft:#47302a; --leaf:#80cd89; --leaf-soft:#2b3f2c;
  --sky:#2b3a40; --gold:#f5c044; --gold-soft:#463d22; --blue:#83b2ee; --blue-soft:#283748;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--lava);outline-offset:2px}

.app{height:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{width:22px;flex:none;transform:rotate(-12deg)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.1;white-space:nowrap}
.top-right{display:flex;gap:8px;align-items:center;flex:none}
.wallet{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:5px 14px 5px 10px;border:0}
.wallet img{width:24px}
.wallet b{font-family:var(--f-display);font-size:18px;font-weight:400;font-variant-numeric:tabular-nums}
.wallet small{font-size:12px;color:var(--soft)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--soft)}
.icon-btn svg{width:20px;height:20px}

.quiz{flex:none;display:flex;flex-direction:column;gap:6px}
.q-card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sign{font-family:var(--f-display);font-size:clamp(32px,8.2vw,50px);line-height:1;display:flex;align-items:center;gap:.25em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sign .op{color:var(--soft);font-size:.8em}
.sign .ans{min-width:1.75em;height:1.35em;padding:0 .2em;display:grid;place-items:center;border-radius:.45em;border:3px dashed var(--lava);background:var(--lava-soft);color:var(--lava-d)}
.sign .ans.ok{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf);animation:pop .45s}
.q-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.pips{display:grid;grid-template-columns:repeat(5,10px);gap:5px}
.pip{width:10px;height:10px;border-radius:50%;background:var(--track)}
.pip.ok{background:var(--leaf)}.pip.meh{background:var(--gold)}.pip.now{background:var(--card);box-shadow:inset 0 0 0 2.5px var(--lava)}
.pill-btn{border:0;border-radius:999px;background:var(--lava-soft);color:var(--lava-d);font-family:var(--f-display);font-size:14px;padding:5px 12px;white-space:nowrap}
.hint{margin:0;height:2.8em;overflow:hidden;text-align:center;color:var(--soft);font-size:14px;line-height:1.35;display:flex;flex-wrap:wrap;gap:3px 5px;justify-content:center;align-items:center;padding-inline:4px}
.hint b{color:var(--ink);font-weight:400;font-family:var(--f-display);font-size:15px}
.hint .seq{font-family:var(--f-display);font-size:14px;background:var(--card);border-radius:8px;padding:1px 7px;color:var(--ink);box-shadow:var(--shadow)}
.hint .seq.q{background:var(--lava);color:#fff}

/* scene (art keeps fixed colours) */
.stage{flex:1 1 auto;min-height:0;display:flex}
.cage{position:relative;flex:1;min-height:150px;border-radius:28px;border:5px solid var(--card);box-shadow:var(--shadow);overflow:hidden;user-select:none;-webkit-user-select:none;background:#cfeaf6}
.sky{position:absolute;inset:0 0 auto 0;height:52%;background:linear-gradient(#b7e1f4,#e8f6f1)}
.ground{position:absolute;inset:44% 0 0 0;background-size:64px 64px}
.edge{position:absolute;left:0;right:0;top:-12px;height:14px;background-size:56px 14px;background-repeat:repeat-x}
.thing{position:absolute;display:block;pointer-events:none}
.volcano{left:1%;bottom:54%;width:30%}
.palm{right:1%;bottom:50%;width:15%}
.fern1{left:26%;bottom:51%;width:12%}
.fern2{right:17%;bottom:52%;width:10%}
.cloud{top:6%;width:16%;animation:drift 38s linear infinite alternate}
.cloud.c2{top:14%;width:11%;animation-duration:52s;animation-direction:alternate-reverse}
.nest{position:absolute;left:50%;bottom:40%;width:31%;aspect-ratio:240/100;transform:translateX(-50%);z-index:2}
.nest img{position:absolute;display:block}
.nest .nb,.nest .nf{inset:0;width:100%}
.nest .nf{z-index:3}
.egg{left:50%;bottom:38%;width:40%;transform:translateX(-50%);z-index:2;transform-origin:50% 90%;filter:drop-shadow(0 0 0 rgba(255,150,60,0));transition:filter .4s}
.egg.warm{animation:wobble .6s ease-in-out;filter:drop-shadow(0 0 14px rgba(255,140,50,.85))}
.egg.big{animation:shakeBig .9s ease-in-out}
.egg.dropin{animation:dropin .6s cubic-bezier(.3,.7,.4,1)}
.shell{left:50%;bottom:38%;width:40%;z-index:2}
.shell.top{animation:shellTop .9s ease-out forwards}
.shell.bot{transform:translateX(-50%)}
.baby{left:50%;bottom:30%;width:78%;z-index:2;animation:born .7s cubic-bezier(.3,1.6,.5,1) both}
.nbubble{position:absolute;left:50%;bottom:150%;transform:translateX(-50%);z-index:5;background:#fff;color:#3d3a2e;border-radius:14px;font-family:var(--f-display);font-size:15px;padding:3px 11px;white-space:nowrap;box-shadow:0 3px 10px rgba(40,60,30,.2)}
.nbubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff}

.buddies{position:absolute;inset:0;z-index:3;pointer-events:none}
.buddy{position:absolute;width:11%;pointer-events:auto;cursor:pointer;transition-property:left,top;transition-timing-function:ease-in-out}
.buddy .bb{position:relative}
.buddy img{width:100%;display:block;filter:drop-shadow(0 4px 2px rgba(40,50,20,.18))}
.buddy.left img{transform:scaleX(-1)}
.buddy.walk .bb{animation:bob .3s ease-in-out infinite alternate}
.buddy.hop .bb{animation:hop .55s ease-out}
.buddy .tag{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;color:#3d3a2e;border-radius:10px;font-family:var(--f-display);font-size:12px;padding:1px 8px;white-space:nowrap;box-shadow:0 2px 6px rgba(40,60,30,.2)}

.hud{position:absolute;left:10px;top:10px;z-index:7;display:flex;gap:6px;pointer-events:none;flex-wrap:wrap}
.chipx{background:rgba(255,255,255,.93);color:#3d3a2e;border-radius:999px;padding:4px 10px;display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:13px;box-shadow:0 2px 6px rgba(40,60,30,.14)}
.chipx.combo{background:#f4743b;color:#fff}
.chipx b{font-weight:400;font-size:15px}
.flames{display:flex;gap:1px}
.flames svg{width:11px;height:13px}

.seeds{position:absolute;inset:0;pointer-events:none;z-index:6}
.seed{position:absolute;pointer-events:auto;width:clamp(58px,11%,88px);aspect-ratio:140/110;border:0;padding:0;background:transparent center/100% 100% no-repeat;
  touch-action:none;display:flex;align-items:center;justify-content:center;transition:opacity .25s;filter:drop-shadow(0 4px 2px rgba(50,40,20,.22)) drop-shadow(0 0 6px rgba(255,140,60,.35))}
.seed span{font-family:var(--f-display);font-size:clamp(19px,3.2vw,28px);color:#fff;line-height:1;margin-top:4%;
  text-shadow:2px 0 0 #3e2d24,-2px 0 0 #3e2d24,0 2px 0 #3e2d24,0 -2px 0 #3e2d24,2px 2px 0 #3e2d24,-2px -2px 0 #3e2d24,2px -2px 0 #3e2d24,-2px 2px 0 #3e2d24}
.seed.falling{animation:drop .55s cubic-bezier(.3,.7,.4,1) both}
.seed.snap{transition:transform .25s ease-out,opacity .25s}
.seed.shake{animation:shake .4s}
.seed.tried{opacity:.35}
.seed.glow{animation:glow 1s ease-in-out infinite}
.seed.fly{transition:transform .48s cubic-bezier(.35,-0.45,.6,1),opacity .2s .4s;z-index:9}
.seed.leave{transition:opacity .25s,transform .25s;opacity:0;transform:translateY(20%) scale(.8)}
.seed:focus-visible{outline:3px solid #ffd23d;outline-offset:2px;border-radius:14px}

.fx{position:absolute;inset:0;pointer-events:none;z-index:8}
.float{position:absolute;font-family:var(--f-display);font-size:22px;color:#f4743b;text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff;animation:floatUp 1s ease-out forwards;white-space:nowrap}
.confetti{position:absolute;width:10px;height:10px;border-radius:50%;animation:fall 1.4s ease-in forwards}
.toast{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:9;background:#fff;color:#3d3a2e;border-radius:16px;box-shadow:0 6px 18px rgba(40,60,30,.22);
  font-family:var(--f-display);font-size:15px;padding:8px 14px;max-width:90%;width:max-content;text-align:center;animation:toast 2.6s forwards}
.overlay{position:absolute;inset:0;z-index:10;background:rgba(30,40,20,.38);display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#fff;color:#3d3a2e;border-radius:26px;box-shadow:0 10px 30px rgba(30,40,20,.3);padding:14px 16px;text-align:center;max-width:340px;width:100%;display:flex;flex-direction:column;gap:8px;max-height:100%;overflow:auto}
.card h2{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;line-height:1.25}
.card .pic{width:auto;max-width:50%;height:clamp(64px,19vh,140px);object-fit:contain;margin:0 auto;animation:born .6s cubic-bezier(.3,1.6,.5,1) both}
.card .stars{font-size:34px;letter-spacing:6px;color:#f2b01e;line-height:1}
.card .stars .off{color:#ece6cf}
.card p{margin:0;font-family:var(--f-display);font-size:17px;line-height:1.45;color:#3d3a2e}
.card b{font-family:var(--f-display);font-weight:400;color:#d4561f}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.card .btn{background:#f6faf2;color:#3d3a2e;border-color:#dce8d2}
.card .btn.sun{background:#f4743b;color:#fff;border-color:#f4743b}
.rar{display:inline-block;font-family:var(--f-display);font-size:12.5px;border-radius:999px;padding:1px 10px;align-self:center}
.rar.common{background:#e3f3d6;color:#3f7f2f}.rar.rare{background:#dfeafc;color:#2f5fa8}.rar.legend{background:#fff0bf;color:#9a6a00}

.goal{flex:none;display:flex;gap:10px;align-items:center;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:8px 12px;border:0;width:100%;text-align:left}
.goal img{width:28px;flex:none}
.goal .g-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.goal .g-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--soft)}
.goal .g-top b{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:14px}
.goal .g-n{font-family:var(--f-display);color:var(--lava-d);font-variant-numeric:tabular-nums;flex:none}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--lava));transition:width .4s}

.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-inline:-6px;padding:2px 6px 6px}
.app[data-view="play"] .scroll{display:none}
.app[data-view="dex"] .quiz,.app[data-view="dex"] .goal,.app[data-view="rec"] .quiz,.app[data-view="rec"] .goal,.app[data-view="rec"] .stage{display:none}
.app[data-view="dex"] .stage{flex:0 0 auto;height:min(30vh,280px)}

.credit{flex:none;text-align:center;font-size:11.5px;line-height:1;margin-top:-4px;color:var(--soft)}
.credit a{color:inherit;text-decoration:none;padding:2px 6px;border-radius:6px}
.credit a:hover,.credit a:focus-visible{text-decoration:underline;color:var(--lava-d)}
.tabbar{flex:none;display:flex;gap:6px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:6px}
.tab{flex:1;border:0;background:transparent;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display);font-size:13px;color:var(--soft)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:var(--lava-soft);color:var(--lava-d)}

.panel{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:16px}
.label{font-family:var(--f-display);font-size:14px;color:var(--soft)}
.btn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:7px 14px;font-family:var(--f-display);font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.sun{background:var(--lava);border-color:var(--lava);color:#fff;box-shadow:0 3px 0 var(--lava-d)}
.btn[disabled]{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-family:var(--f-display);font-size:15px}
.chip[aria-pressed="true"]{background:var(--lava);border-color:var(--lava);color:#fff}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.sec-h span{font-size:13px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dino{border:2px solid var(--line);border-radius:18px;background:var(--card);display:flex;flex-direction:column;gap:5px;padding:10px}
.dino.out{background:var(--leaf-soft);border-color:var(--leaf)}
.dino .pv{height:96px;display:flex;align-items:center;justify-content:center;background:var(--sky);border-radius:14px;position:relative}
.dino .pv img{max-height:84px;max-width:88%}
.dino.unknown .pv img{filter:brightness(0) opacity(.18)}
.dino h3{font-family:var(--f-display);font-weight:400;font-size:16px;margin:0;line-height:1.25}
.dino .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.dino .rar{align-self:auto}
.dino p{margin:0;font-size:12.5px;color:var(--soft);line-height:1.4;flex:1}
.dino .btn{font-size:14px;padding:6px 8px;width:100%}
.cnt{position:absolute;right:8px;top:6px;font-family:var(--f-display);font-size:13px;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:16px;padding:10px 12px;background:var(--sky)}
.tile b{display:block;font-family:var(--f-display);font-size:22px;font-weight:400;margin-top:2px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:4px;font-variant-numeric:tabular-nums;min-width:520px;width:100%}
.mx th{font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--soft);padding:2px 4px}
.mx td{border-radius:10px;text-align:center;font-size:12px;padding:6px 2px;background:var(--track);color:var(--ink)}
.mx td.l1{background:var(--lava-soft)}
.mx td.l2{background:var(--leaf-soft)}
.mx td.l3{background:var(--gold);color:#3d3a2e;font-family:var(--f-display);font-size:14px}
.mx td.row-sum{background:none;font-family:var(--f-display);color:var(--soft)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}
.danger{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--soft)}

.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(30,40,20,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;text-align:center}
.sheet .chips{justify-content:center;gap:8px}
.sheet .chip{font-size:18px;padding:7px 15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--track);border-radius:16px;padding:4px}
.seg button{border:0;background:transparent;border-radius:12px;padding:8px 4px;font-family:var(--f-display);font-size:17px;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--lava-d);box-shadow:var(--shadow)}
.sheet .btn{font-size:17px;padding:10px}
.sheet .lvl-desc{text-align:center;font-size:13.5px;color:var(--soft);margin-top:-4px;min-height:1.4em}
.sheet .sec{font-family:var(--f-display);font-size:15px;color:var(--ink);text-align:center;margin-top:2px}

@media (max-width:560px){
  .app{gap:8px;padding-block:8px}
  .brand h1{font-size:19px}
  .hint{font-size:13px;min-height:2.7em}
  .seed{width:clamp(56px,17%,80px)}
  .nest{width:46%}
  .buddy{width:16%}
  .volcano{width:40%}.palm{width:22%}.fern1{width:18%;left:30%}.fern2{width:15%;right:22%}
  .cloud{width:24%}.cloud.c2{width:16%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .dino{padding:8px}.dino .pv{height:80px}.dino .pv img{max-height:70px}
  .panel{padding:14px}
  .tile{padding:8px}.tile b{font-size:18px}
}
@media (max-height:760px){
  .app{gap:6px;padding-block:6px}
  .top .wallet{padding:3px 12px 3px 8px}.icon-btn{width:34px;height:34px}.brand h1{font-size:18px}
  .sign{font-size:clamp(28px,7.4vw,40px)}.q-card{padding:6px 12px;border-radius:20px}.q-meta{gap:5px}.pill-btn{font-size:13px;padding:4px 10px}
  .hint{font-size:12.5px;height:2.7em}
  .tabbar{padding:4px;border-radius:18px}
  .card{gap:5px}.card h2{font-size:20px}.card p{font-size:16px}
  .tab{flex-direction:row;justify-content:center;gap:6px;padding:7px 4px}.tab svg{width:20px;height:20px}
}

@keyframes drop{0%{transform:translateY(-260%) rotate(-25deg);opacity:0}60%{transform:translateY(5%) rotate(6deg);opacity:1}80%{transform:translateY(-6%) rotate(-2deg)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-14%) rotate(-8deg)}40%{transform:translateX(12%) rotate(7deg)}60%{transform:translateX(-8%)}80%{transform:translateX(6%)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #ffe08a)}50%{filter:drop-shadow(0 0 12px #ffd23d) drop-shadow(0 0 3px #fff)}}
@keyframes wobble{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-8deg)}50%{transform:translateX(-50%) rotate(7deg)}75%{transform:translateX(-50%) rotate(-4deg)}}
@keyframes shakeBig{0%,100%{transform:translateX(-50%) rotate(0)}10%,30%,50%,70%,90%{transform:translateX(-50%) rotate(-12deg) scale(1.04)}20%,40%,60%,80%{transform:translateX(-50%) rotate(12deg) scale(1.04)}}
@keyframes dropin{0%{transform:translateX(-50%) translateY(-220%);opacity:0}70%{transform:translateX(-50%) translateY(6%);opacity:1}100%{transform:translateX(-50%)}}
@keyframes shellTop{0%{transform:translateX(-50%)}100%{transform:translateX(-10%) translateY(-120%) rotate(70deg);opacity:0}}
@keyframes born{0%{transform:translateX(-50%) scale(0)}100%{transform:translateX(-50%) scale(1)}}
.card .pic{animation-name:pop}
@keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-6%)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-35%)}70%{transform:translateY(3%)}}
@keyframes floatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-240%);opacity:0}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(560px) rotate(540deg);opacity:.2}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,30%)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,30%)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){
  .seed.falling,.egg.warm,.egg.big,.egg.dropin,.shell.top,.baby,.buddy .bb,.seed.glow,.confetti,.sheet,.cloud,.card .pic{animation:none!important}

}

<script>
(()=>{
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const svg=(vb,body)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${body}</svg>`);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const OUT='#43301f';
const LN=(w=6)=>`stroke="${OUT}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nb=n=>[0,1,3,6,7,8].includes(Math.abs(n)%10);
const nGa=n=>nb(n)?'이':'가',nEun=n=>nb(n)?'은':'는',nEul=n=>nb(n)?'을':'를';

/* ---------- 50 species ---------- */
// [id, kind, rarity, ko, en, [body,belly,accent], pattern, factKo, factEn]
const RAW=[
['stego','stego','c','스테고사우루스','Stegosaurus',['#8fbbe8','#e6f1ff','#f2879f'],'dots','등에 커다란 골판이 두 줄로 솟아 있었어요.','It had two rows of big plates on its back.'],
['trike','trike','c','트리케라톱스','Triceratops',['#f3a75c','#fde9cc','#e9685a'],'','이름이 "뿔이 세 개 달린 얼굴"이라는 뜻이에요.','Its name means "three-horned face".'],
['para','para','c','파라사우롤로푸스','Parasaurolophus',['#6cc4b6','#ddf5f0','#f2788b'],'dots','머리 위 긴 볏으로 나팔 같은 소리를 냈을 거예요.','Its long head crest may have worked like a trumpet.'],
['pachy','pachy','c','파키케팔로사우루스','Pachycephalosaurus',['#f39db2','#ffe7ee','#c9667f'],'','아주 두꺼운 둥근 머리뼈를 가졌어요.','It had a very thick, dome-shaped skull.'],
['proto','proto','c','프로토케라톱스','Protoceratops',['#d9b77a','#f7ecd2','#b98a4e'],'dots','양만 한 크기로, 큰 뿔 없이 목 방패만 있었어요.','About the size of a sheep, with a neck frill but no big horns.'],
['edmonto','hadro','c','에드몬토사우루스','Edmontosaurus',['#9ab86a','#eef5dc','#6f8f45'],'stripes','오리처럼 넓적한 주둥이로 식물을 먹었어요.','It ate plants with a wide, duck-like bill.'],
['maia','hadro','c','마이아사우라','Maiasaura',['#e6a6d8','#fbe9f6','#b56ea8'],'spots','이름이 "착한 엄마 도마뱀"이라는 뜻이에요. 둥지에서 새끼를 돌봤어요.','Its name means "good mother lizard". It cared for its babies in nests.'],
['iguano','iguano','c','이구아노돈','Iguanodon',['#7fb08a','#e5f3e6','#4f7f5c'],'stripes','엄지손가락에 뾰족한 가시가 있었어요.','It had a sharp spike on each thumb.'],
['kentro','kentro','c','켄트로사우루스','Kentrosaurus',['#f2c45a','#fff3cf','#d9663f'],'','등과 꼬리에 긴 가시가 줄줄이 나 있었어요.','It had long spikes along its back and tail.'],
['cory','cory','c','코리토사우루스','Corythosaurus',['#7aa6e0','#e4eeff','#f5a33c'],'dots','머리 위 볏이 헬멧처럼 둥글었어요.','Its round crest looked like a helmet.'],
['lambeo','lambeo','c','람베오사우루스','Lambeosaurus',['#c4a0e8','#f2e8ff','#7f5cc4'],'spots','머리 볏이 도끼 모양이었어요.','Its head crest was shaped like a hatchet.'],
['psitta','psitta','c','프시타코사우루스','Psittacosaurus',['#a8d86a','#f1fadf','#e8b04a'],'dots','앵무새처럼 생긴 부리를 가졌어요.','It had a beak like a parrot.'],
['hypacro','cory','c','히파크로사우루스','Hypacrosaurus',['#f0907a','#ffe6df','#7a6fd6'],'stripes','둥지에 알을 낳고 무리 지어 살았어요.','It laid eggs in nests and lived in herds.'],
['centro','centro','c','센트로사우루스','Centrosaurus',['#c9876a','#f6e2d6','#f5d08a'],'','코 위에 커다란 뿔이 하나 있었어요.','It had one big horn on its nose.'],
['galli','galli','c','갈리미무스','Gallimimus',['#e8d1a0','#fbf3e2','#c79a52'],'stripes','타조처럼 아주 빨리 달렸어요.','It could run fast, like an ostrich.'],
['compy','compy','c','콤프소그나투스','Compsognathus',['#93cf8a','#eaf7e6','#4f9a52'],'stripes','닭만 한 아주 작은 공룡이에요.','A tiny dinosaur about the size of a chicken.'],
['ovi','ovi','c','오비랍토르','Oviraptor',['#5fb3d9','#e1f3fb','#f07a8a'],'','알을 품는 모습의 친척 화석이 발견됐어요.','Its relatives were found sitting on their nests of eggs.'],
['stegoceras','stegoceras','c','스테고케라스','Stegoceras',['#b5a2e6','#efe9ff','#7c64c4'],'dots','작은 박치기 공룡으로 머리가 단단했어요.','A small dinosaur with a hard, domed head.'],
['hypsi','compy','c','힙실로포돈','Hypsilophodon',['#f0c060','#fff3d6','#c98a2e'],'spots','몸집이 작고 재빠르게 달리는 초식 공룡이에요.','A small, quick-running plant eater.'],
['tsintao','tsintao','c','칭다오사우루스','Tsintaosaurus',['#7cc4a0','#e2f6ec','#f2a541'],'dots','머리에 유니콘처럼 볏이 하나 솟아 있었어요.','It had a single crest on its head, like a unicorn.'],
['anky','anky','r','안킬로사우루스','Ankylosaurus',['#cba56b','#f4e7c9','#8a6738'],'','꼬리 끝에 뼈로 된 곤봉이 있었어요.','It had a bony club at the end of its tail.'],
['ptera','ptera','r','프테라노돈','Pteranodon',['#f4c44f','#fff2c6','#e8924a'],'','하늘을 날던 파충류로, 사실 공룡은 아니에요.','A flying reptile. It wasn\'t actually a dinosaur!'],
['raptor','raptor','r','벨로키랍토르','Velociraptor',['#a8cb59','#f1f8d6','#e5604a'],'stripes','칠면조만 한 크기에 깃털이 있었어요.','It was about the size of a turkey and had feathers.'],
['nodo','nodo','r','노도사우루스','Nodosaurus',['#8f9f8a','#e7ede4','#5c6b57'],'','온몸이 갑옷 판으로 덮여 있었지만 꼬리 곤봉은 없었어요.','It was covered in armor plates but had no tail club.'],
['dilo','dilo','r','딜로포사우루스','Dilophosaurus',['#f0b85a','#fff0d2','#e2533f'],'stripes','머리 위에 볏이 두 개 있었어요.','It had two crests on its head.'],
['allo','allo','r','알로사우루스','Allosaurus',['#d98a5c','#fbe4d6','#9c4d33'],'stripes','눈 위에 작은 뿔 같은 돌기가 있었어요.','It had small horn-like bumps above its eyes.'],
['carno','carno','r','카르노타우루스','Carnotaurus',['#e06a5a','#fde0da','#8e2f2a'],'dots','황소처럼 머리에 뿔이 두 개 있었어요.','It had two horns on its head, like a bull.'],
['styraco','styraco','r','스티라코사우루스','Styracosaurus',['#9cc26a','#eef7dd','#f2a53c'],'','목 방패 가장자리에 긴 가시가 여러 개 있었어요.','Its frill had several long spikes around the edge.'],
['diplo','diplo','r','디플로도쿠스','Diplodocus',['#88b4c8','#e5f2f7','#55798a'],'spots','꼬리가 아주 길어서 채찍처럼 휘둘렀을 거예요.','Its very long tail may have worked like a whip.'],
['amarga','amarga','r','아마르가사우루스','Amargasaurus',['#d4a2c4','#f8e9f3','#9a5f88'],'','목을 따라 긴 가시가 줄지어 나 있었어요.','It had tall spines along its neck.'],
['deinony','raptor','r','데이노니쿠스','Deinonychus',['#6d8fd0','#e3ebfa','#f2c54a'],'stripes','발에 커다란 갈고리 발톱이 있었어요.','It had a big curved claw on each foot.'],

const keyOf=(op,a,b)=>op==='mul'?`${a}x${b}`:`${a*b}d${a}`;
const lvl=k=>(S.m[k]||{s:0}).s;
function pickFact(){
  const ok=f=>S.tables.includes(f.a)&&(S.mode==='mix'||S.mode===f.op)&&f.key!==lastKey;
  const due=review.findIndex(r=>r.due<=R.i&&ok(r));if(due>=0)return review.splice(due,1)[0];
  const ops=S.mode==='mix'?['mul','div']:[S.mode],pool=[];
  const bMin=S.level==='hard'?2:1,bMax=S.level==='easy'?5:9;
  ops.forEach(op=>S.tables.forEach(a=>{for(let b=bMin;b<=bMax;b++){const key=keyOf(op,a,b);if(key===lastKey)continue;pool.push([{op,a,b,key},(b===1?1:2)+(3-lvl(key))*3])}}));
  let t=Math.random()*pool.reduce((s,p)=>s+p[1],0),f=pool[0][0];for(const p of pool){t-=p[1];if(t<=0){f=p[0];break}}
  if(S.level==='hard'&&f.op==='mul'&&Math.random()<.4)f={...f,blank:true};return f}
function choices(f){const shuf=a=>a.sort(()=>Math.random()-.5),lv=S.level,n=lv==='easy'?4:6;
  if(f.op==='div'||f.blank){const b=f.b,set=new Set();
    if(lv==='hard'){shuf([b-1,b+1,b-2,b+2,b-3,b+3,b+4]).forEach(v=>{if(v>=1&&v<=9&&v!==b&&set.size<n-1)set.add(v)})}
    if(lv==='easy'){let g=0;while(set.size<n-1&&g++<200){const v=1+Math.random()*9|0;if(Math.abs(v-b)>=2)set.add(v)}}
    if(lv!=='normal'){let g=0;while(set.size<n-1&&g++<200){const v=1+Math.random()*9|0;if(v!==b)set.add(v)}return shuf([...set,b])}
  }
  if(lv==='easy'&&f.op==='mul'){const ans=f.a*f.b,set=new Set();let g=0;while(set.size<3&&g++<300){const v=(2+Math.random()*8|0)*(1+Math.random()*9|0);if(Math.abs(v-ans)>=4)set.add(v)}
    while(set.size<3){set.add(ans+5+set.size*3)}return shuf([...set,ans])}
  if(lv==='hard'&&f.op==='mul'){const{a,b}=f,ans=a*b,set=new Set();shuf([a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+2,ans-2,(a+1)*(b-1),(a-1)*(b+1)]).forEach(v=>{if(v>0&&v!==ans&&set.size<5)set.add(v)});
    while(set.size<5)set.add(ans+10+set.size);return shuf([...set,ans])}
  if(f.op==='div'){const b=f.b,set=new Set();shuf([b-1,b+1,b+2,b-2,f.a]).forEach(v=>{if(v>=1&&v<=9&&v!==b&&set.size<3)set.add(v)});
    while(set.size<5){const v=1+Math.random()*9|0;if(v!==b)set.add(v)}return shuf([...set,b])}
  const{a,b}=f,ans=a*b,set=new Set();
  shuf([a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+10,ans-10]).forEach(v=>{if(v>0&&v!==ans&&set.size<3)set.add(v)});
  [a*(b+1),a*(b-1),(a+1)*b,(a-1)*b].forEach(v=>{if(v>0&&v!==ans&&set.size<4)set.add(v)});
  let g=0;while(set.size<5&&g++<200){const v=(2+Math.random()*8|0)*(1+Math.random()*9|0);if(v!==ans)set.add(v)}
  return shuf([...set,ans])}
function newQuestion(){
  const f=pickFact();lastKey=f.key;cur={...f,ans:f.op==='mul'&&!f.blank?f.a*f.b:f.b,first:true,miss:0};
  const eB=$('#eqB'),an=$('#eqAns');eB.classList.remove('ans','ok');an.classList.remove('ok');

  $('#hint').textContent=T().startHint;spawnStones(choices(f));renderPips()}
function spawnStones(vals){
  seedsEl.querySelectorAll('.seed').forEach(s=>{s.classList.add('leave');setTimeout(()=>s.remove(),260)});
  const r=cage.getBoundingClientRect();
  const els=vals.map(v=>{const b=document.createElement('button');b.type='button';b.className='seed falling';b.dataset.v=v;b.style.backgroundImage=`url("${stoneURL}")`;
    b.setAttribute('aria-label',T().stone+' '+v);b.innerHTML='<span>'+v+'</span>';seedsEl.appendChild(b);return b});
  const sw=els[0].offsetWidth,sh=els[0].offsetHeight;
  const x0=r.width*0.04,x1=r.width*0.96-sw,y0=r.height*0.64,y1=Math.max(y0,r.height*0.97-sh);
  const per=Math.ceil(vals.length/2),slots=[];for(let row=0;row<2;row++)for(let c=0;c<per;c++){const t=(c+(row?0.5:0))/(per-0.5);slots.push([x0+t*(x1-x0),row?y1:y0])}
  els.forEach((el,i)=>{const[x,y]=slots[i];const jx=(Math.random()-.5)*r.width*0.05,jy=(Math.random()-.5)*(y1-y0)*0.2;
    el.style.left=Math.min(Math.max(x+jx,4),r.width-sw-4)/r.width*100+'%';el.style.top=Math.min(Math.max(y+jy,y0-6),r.height-sh-4)/r.height*100+'%';
    el.style.animationDelay=(i*70)+'ms';el.addEventListener('animationend',e=>{if(e.animationName==='drop')el.classList.remove('falling')});bindStone(el)});

let drag=null;
function bindStone(el){
  el.addEventListener('pointerdown',e=>{if(busy||el.classList.contains('tried'))return;e.preventDefault();el.classList.remove('falling','snap');
    try{el.setPointerCapture(e.pointerId)}catch(_){}drag={el,sx:e.clientX,sy:e.clientY,moved:false}});
  el.addEventListener('pointermove',e=>{if(!drag||drag.el!==el)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)>8)drag.moved=true;if(drag.moved)el.style.transform=`translate(${dx}px,${dy}px) scale(1.12)`});
  const end=(e,cancel)=>{if(!drag||drag.el!==el)return;const d=drag;drag=null;
    if(!d.moved&&!cancel){choose(el);return}
    const a=el.getBoundingClientRect(),h=$('#nest').getBoundingClientRect(),pad=24;
    const over=!cancel&&a.right>h.left-pad&&a.left<h.right+pad&&a.bottom>h.top-h.height-pad&&a.top<h.bottom+pad;
    if(over&&+el.dataset.v===cur.ans){choose(el);return}
    el.classList.add('snap');el.style.transform='';if(over)choose(el)};
  el.addEventListener('pointerup',e=>end(e,false));el.addEventListener('pointercancel',e=>end(e,true));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el)}})}
async function choose(el){

  busy=true;seedsEl.querySelectorAll('.seed').forEach(s=>s.classList.remove('glow'));
  const er=eggEl.getBoundingClientRect(),sr=el.getBoundingClientRect(),base=el.style.transform.match(/translate\(([-\d.]+)px, ?([-\d.]+)px\)/);

  tone(SND.whoosh);await wait(RM?60:470);
  const k=cur.key,m=S.m[k]||(S.m[k]={s:0,r:0,w:0});m.r++;let bonus=0;
  if(cur.first){m.s=Math.min(3,m.s+1);combo++;S.first++;if(combo%5===0)bonus=1}else combo=0;
  S.solved++;S.egg.warm+=1+bonus;S.warmth+=1+bonus;R.warm+=1+bonus;R.res.push(cur.first?'ok':'meh');
  eggEl.classList.remove('warm');void eggEl.offsetWidth;eggEl.classList.add('warm');renderEgg();tone(SND.warm);
  say(S.egg.warm>=need()?T().soon:pick(T().warm));buddiesHop();
  const nr=$('#nest').getBoundingClientRect(),cr=cage.getBoundingClientRect();
  floatText(T().plus,(nr.left+nr.width/2-cr.left)/cr.width*100,(nr.top-cr.top)/cr.height*100-6);
  if(bonus){setTimeout(()=>tone(SND.bonus),300);toast(T().combo(combo))}
  const an=cur.blank?$('#eqB'):$('#eqAns');an.textContent=cur.ans;an.classList.add('ok');
  const eq=cur.op==='mul'?`${cur.a} × ${cur.b} = ${cur.a*cur.b}`:`${cur.a*cur.b} ÷ ${cur.a} = ${cur.b}`;
  $('#hint').innerHTML=`<b>${eq}</b> ${esc(cur.first?T().right:T().again)}`;
  save();renderEggUI();renderCombo();
  await wait(700);
  if(S.egg.warm>=need())await hatch();
  R.i++;
  if(R.i>=10){renderPips();roundEnd();busy=false;return}
  newQuestion();await wait(400);busy=false}
function wrong(el,v){
  el.classList.remove('falling','shake');void el.offsetWidth;el.classList.add('shake','tried');setTimeout(()=>el.classList.remove('shake'),420);
  tone(SND.bad);say(T().cold);
  if(cur.first){const m=S.m[cur.key]||(S.m[cur.key]={s:0,r:0,w:0});m.w++;m.s=0;review.push({op:cur.op,a:cur.a,b:cur.b,key:cur.key,due:R.i+3});combo=0;renderCombo();save()}
  cur.first=false;cur.miss++;
  const{a,b}=cur,t=T();let lead,seq='';
  if(cur.op==='mul'&&!cur.blank){
    if(v===a*(b-1))lead=t.hMore(v,a,b-1);else if(v===a*(b+1))lead=t.hLess(v,a,b+1);else if(b===1)lead=t.hOne;else lead=t.hCount(a,b);
    if(b>1)seq=`<span class="seq">${Array.from({length:b-1},(_,i)=>a*(i+1)).join(', ')}, ?</span>`;
  }else{const c=a*b;
    if(v===b-1)lead=t.dLess(a,v,c);else if(v===b+1)lead=t.dMore(a,v,c);else lead=t.dCount(a,c);
    seq=`<span class="seq">${Array.from({length:b},(_,i)=>a*(i+1)).join(', ')}</span>`}
  $('#hint').innerHTML=`<span>${esc(lead)}</span>${seq}`;
  if(S.level!=='hard'&&cur.miss>=(S.level==='easy'?1:2)){const c=[...seedsEl.querySelectorAll('.seed')].find(s=>+s.dataset.v===cur.ans);if(c)c.classList.add('glow')}}
async function hatch(){
  const d=dinoById[S.egg.sp],t=T();seedsEl.querySelectorAll('.seed').forEach(s=>s.style.visibility='hidden');
  say(t.crack,1400);eggEl.classList.remove('warm');void eggEl.offsetWidth;eggEl.classList.add('big');tone(SND.crack);await wait(RM?150:950);
  eggEl.classList.remove('big');eggEl.hidden=true;
  const st=$('#shellTop'),sb=$('#shellBot'),bb=$('#baby');st.src=drawShell(d.rar,'top');sb.src=drawShell(d.rar,'bot');bb.src=dinoImg(d.id,'happy');
  st.hidden=false;sb.hidden=false;bb.hidden=false;st.classList.remove('top');void st.offsetWidth;st.classList.add('top');
  confetti();tone(SND.hatch);
  const first=!S.dex[d.id];S.dex[d.id]=(S.dex[d.id]||0)+1;S.hatched++;R.hatched++;
  const fitsYard=S.yard.length<YARD_MAX;if(fitsYard)S.yard.push({id:d.id,u:Date.now().toString(36)+Math.random().toString(36).slice(2,6)});
  const nowFull=S.yard.length>=YARD_MAX;if(nowFull)$('#schoolBtn').hidden=true;
  save();await wait(1100);
  await new Promise(res=>{$('#overCard').innerHTML=`<img class="pic" src="${dinoImg(d.id)}" alt=""><span class="rar ${d.rar}">${t.rar[d.rar]}</span>
    <h2>${first?t.newDino:t.meetAgain}<br>${esc(dName(d))}</h2><p>${esc(dFact(d))}</p>
    ${first?'':`<p style="color:#7f8a6f;font-size:14px">${t.soFar(S.dex[d.id])}</p>`}${nowFull?`<p style="color:#d4561f;font-size:15px">${t.yardFull}</p>`:''}
    <div class="row">${nowFull?`<button class="btn sun" id="schoolNow" type="button">${t.toSchool}</button>`:`<button class="btn sun" id="hiBtn" type="button">${t.hi}</button>`}</div>`;
    $('#overlay').hidden=false;if(!nowFull)$('#hiBtn').onclick=()=>{$('#overlay').hidden=true;res()};
    if(nowFull)$('#schoolNow').onclick=()=>{$('#overlay').hidden=true;finishHatch();hatchWait=res;busy=false;startTrip();busy=true}});
  finishHatch()}
let hatchFinished=false;
function finishHatch(){if(!$('#baby').hidden||!$('#shellTop').hidden){
  $('#shellTop').hidden=true;$('#shellBot').hidden=true;$('#baby').hidden=true;
  S.egg={sp:pickSpecies(),warm:0};save();renderEgg();eggEl.hidden=false;eggEl.classList.remove('dropin');void eggEl.offsetWidth;eggEl.classList.add('dropin');
  renderYard();renderEggUI();say(T().arrived(eggN(dinoById[S.egg.sp].rar)),1500);
  seedsEl.querySelectorAll('.seed').forEach(s=>s.style.visibility='')}}
function roundEnd(){const t=T();
  const ok=R.res.filter(x=>x==='ok').length,stars=ok>=10?3:ok>=8?2:ok>=5?1:0,left=Math.max(0,need()-S.egg.warm);
  $('#overCard').innerHTML=`<h2>${t.roundDone}</h2>
   <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">★</span>`).join('')}</div>
   <p>${t.firstTry(ok,R.warm)}</p><p>${R.hatched?t.hatchedRound(R.hatched):t.leftWarm(left)}</p>
   <div class="row"><button class="btn sun" id="again" type="button">${t.playAgain}</button><button class="btn" id="toDex" type="button">${t.seeDex}</button></div>`;
  $('#overlay').hidden=false;if(stars===3)confetti();tone(SND.bonus);
  $('#again').onclick=()=>{$('#overlay').hidden=true;startRound()};
  $('#toDex').onclick=()=>{$('#overlay').hidden=true;startRound();setTab('dex')}}
function startRound(){R.i=0;R.res=[];R.warm=0;R.hatched=0;newQuestion()}

/* ---------- settings ---------- */
function tablesLabel(){const t=S.tables.slice().sort((a,b)=>a-b),L1=T();if(t.length===8)return L1.allTables;
  const run=t.every((v,i)=>!i||v===t[i-1]+1);return run&&t.length>2?L1.range(t[0],t[t.length-1]):L1.list(t)}
function renderSettings(){const t=T(),c=$('#tableChips');c.innerHTML='';
  for(let a=2;a<=9;a++){const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t.tbl(a);b.setAttribute('aria-pressed',S.tables.includes(a));
    b.onclick=()=>{if(S.tables.includes(a)){if(S.tables.length===1)return;S.tables=S.tables.filter(x=>x!==a)}else S.tables=[...S.tables,a].sort();save();renderSettings()};c.appendChild(b)}
  const all=document.createElement('button');all.type='button';all.className='chip';all.textContent=t.all;all.setAttribute('aria-pressed',S.tables.length===8);
  all.onclick=()=>{S.tables=[2,3,4,5,6,7,8,9];save();renderSettings()};c.appendChild(all);
  document.querySelectorAll('#modeSeg button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.mode===S.mode);b.textContent=b.dataset.mode==='mul'?t.mulSeg:b.dataset.mode==='div'?t.divSeg:t.mix});
  document.querySelectorAll('#levelSeg button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.level===S.level);b.textContent=t.lv[b.dataset.level]});
  $('#lvlDesc').textContent=t.lvDesc[S.level];$('#secType').textContent=t.secType;$('#secLevel').textContent=t.secLevel;
  $('#setBtn').innerHTML='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'+t[S.mode]+' · '+t.lv[S.level];$('#setBtn').setAttribute('aria-label',t.settings+': '+t[S.mode]+', '+t.lv[S.level]+', '+tablesLabel())}
document.querySelectorAll('#levelSeg button').forEach(b=>b.onclick=()=>{S.level=b.dataset.level;save();renderSettings()});
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();renderSettings()});
let sheetSnap='';
$('#setBtn').onclick=()=>{sheetSnap=S.mode+S.level+S.tables.join();$('#sheet').hidden=false};
function closeSheet(){$('#sheet').hidden=true;if(!busy&&sheetSnap!==S.mode+S.level+S.tables.join()){review=[];newQuestion()}}
$('#sheetDone').onclick=closeSheet;$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
function renderPips(){$('#pips').innerHTML=Array.from({length:10},(_,i)=>`<span class="pip ${R.res[i]||(i===R.i?'now':'')}"></span>`).join('')}
function renderCombo(){$('#combo').textContent=combo;$('#comboTxt').textContent=T().inrow;$('#comboBox').hidden=combo<2}
const SPK=on=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/>${on?'<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>':'<path d="m17 9 5 6M22 9l-5 6"/>'}</svg>`;
function renderSound(){const b=$('#soundBtn');b.innerHTML=SPK(S.sound);b.setAttribute('aria-label',S.sound?T().mute:T().unmute)}

/* ---------- dex ---------- */
let dexFilter='all';
function renderDex(){const t=T(),P=$('#panel-dex'),got=DINOS.filter(d=>S.dex[d.id]).length;
  let h=`<div style="display:flex;flex-direction:column;gap:6px"><div class="sec-h"><h2>${t.dexTitle}</h2><span>${t.found(got,DINOS.length)}</span></div><div class="bar"><i style="width:${got/DINOS.length*100}%"></i></div>
   <span class="label" style="font-size:13px">${t.dexInfo}${S.schooled?' · '+t.school(S.schooled):''}</span></div>
   <div class="dex-filter">${['all','common','rare','legend'].map(f=>`<button type="button" class="chip" data-f="${f}" aria-pressed="${dexFilter===f}">${f==='all'?t.filterAll:t.rar[f]} ${f==='all'?'':`${DINOS.filter(d=>d.rar===f&&S.dex[d.id]).length}/${DINOS.filter(d=>d.rar===f).length}`}</button>`).join('')}</div><div class="grid">`;
  DINOS.filter(d=>dexFilter==='all'||d.rar===dexFilter).forEach(d=>{const n=S.dex[d.id]||0;
    if(!n){h+=`<div class="dino unknown"><div class="pv"><img src="${dinoImg(d.id)}" alt="" loading="lazy"></div><h3>???</h3><div class="meta"><span class="rar ${d.rar}">${t.rar[d.rar]}</span></div><p>${esc(t.unknown(eggN(d.rar)))}</p></div>`;return}
    h+=`<div class="dino"><div class="pv"><img src="${dinoImg(d.id)}" alt="" loading="lazy"><span class="cnt">×${n}</span></div><h3>${esc(dName(d))}</h3><div class="meta"><span class="rar ${d.rar}">${t.rar[d.rar]}</span></div><p>${esc(dFact(d))}</p></div>`});
  P.innerHTML=h+'</div>';
  P.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{dexFilter=b.dataset.f;renderDex()})}

/* ---------- record ---------- */
let recOp='mul',resetArm=false;
function renderRec(){const t=T(),P=$('#panel-rec');let gold=0,rows='';
  for(let a=2;a<=9;a++){let cells='',g=0;for(let b=1;b<=9;b++){const k=keyOf(recOp,a,b),l=lvl(k),seen=S.m[k];if(l===3)g++;
      const lab=recOp==='mul'?(l===3?a*b:a+'×'+b):(l===3?b:(a*b)+'÷'+a);
      cells+=`<td class="${seen?'l'+Math.max(1,l):''}" title="${recOp==='mul'?`${a}×${b}=${a*b}`:`${a*b}÷${a}=${b}`}">${lab}</td>`}
    gold+=g;rows+=`<tr><th scope="row">${t.rowLab(recOp,a)}</th>${cells}<td class="row-sum">${g}/9</td></tr>`}
  const rate=S.solved?Math.round(S.first/S.solved*100):0;
  P.innerHTML=`<div class="sec-h"><h2>${t.recTitle}</h2><span>${t.recSub}</span></div>
   <div class="tiles"><div class="tile"><div class="label">${t.solved}</div><b>${S.solved}</b></div><div class="tile"><div class="label">${t.firstPct}</div><b>${rate}%</b></div><div class="tile"><div class="label">${t.hatchedN}</div><b>${S.hatched}</b></div></div>
   <div class="seg" style="max-width:300px;grid-template-columns:1fr 1fr"><button type="button" data-op="mul" aria-pressed="${recOp==='mul'}">${t.mul}</button><button type="button" data-op="div" aria-pressed="${recOp==='div'}">${t.div}</button></div>
   <div class="tbl-wrap"><table class="mx"><thead><tr><th></th>${[1,2,3,4,5,6,7,8,9].map(b=>`<th scope="col">${t.colLab(recOp,b)}</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="legend"><span><i style="background:var(--track)"></i>${t.lg0}</span><span><i style="background:var(--lava-soft)"></i>${t.lg1}</span><span><i style="background:var(--leaf-soft)"></i>${t.lg2}</span><span><i style="background:var(--gold)"></i>${t.lg3(gold)}</span></div>
   <div class="danger">${resetArm?`<span>${t.resetQ}</span><button type="button" class="btn" id="rsYes">${t.resetYes}</button><button type="button" class="btn" id="rsNo">${t.resetNo}</button>`
     :`<button type="button" class="btn" id="rsArm">${t.reset}</button>`}</div>`;
  P.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{recOp=b.dataset.op;renderRec()});
  if(resetArm){$('#rsYes').onclick=()=>{const keep={sound:S.sound,lang:S.lang};S=JSON.parse(JSON.stringify(DEF));Object.assign(S,keep);S.egg={sp:pickSpecies(),warm:0};save();resetArm=false;combo=0;review=[];
      renderEgg();renderEggUI();renderYard();renderSettings();renderCombo();startRound();renderRec()};$('#rsNo').onclick=()=>{resetArm=false;renderRec()}}
  else $('#rsArm').onclick=()=>{resetArm=true;renderRec()}}

/* ---------- tabs & language ---------- */
let view='play';
function setTab(t){view=t;$('#app').dataset.view=t;['play','dex','rec'].forEach(k=>$('#tab-'+k).setAttribute('aria-selected',k===t));
  $('#panel-dex').hidden=t!=='dex';$('#panel-rec').hidden=t!=='rec';seedsEl.hidden=t!=='play';
  if(t==='dex')renderDex();if(t==='rec')renderRec();$('#scroll').scrollTop=0}
$('#tab-play').onclick=()=>setTab('play');$('#tab-dex').onclick=()=>setTab('dex');$('#tab-rec').onclick=()=>setTab('rec');
$('#wallet').onclick=()=>setTab('dex');
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();renderSound();tone(SND.warm)};
function applyLang(){const t=T();document.documentElement.lang=S.lang;document.title=t.title;
  $('#appTitle').textContent=t.title;$('#wallet').title=t.wallet;$('#langBtn').textContent=t.langTo;$('#langBtn').setAttribute('aria-label',t.langAria);
  $('#tabPlay').textContent=t.play;$('#tabDex').textContent=t.dex;$('#tabRec').textContent=t.rec;
  $('#sheetTitle').textContent=t.sheetTitle;$('#sheetTables').textContent=t.sheetTables;$('#sheetDone').textContent=t.done;$('#schoolTxt').textContent=t.toSchool;
  eggEl.alt=t.eggAlt;seedsEl.querySelectorAll('.seed').forEach(s=>s.setAttribute('aria-label',t.stone+' '+s.dataset.v));
  if(cur&&!$('#eqAns').classList.contains('ok'))$('#hint').textContent=t.startHint;
  renderSettings();renderSound();renderEggUI();renderYard();renderCombo();if(view==='dex')renderDex();if(view==='rec')renderRec()}
$('#langBtn').onclick=()=>{S.lang=S.lang==='ko'?'en':'ko';save();applyLang()};

/* ---------- boot ---------- */
applyLang();renderEgg();
requestAnimationFrame(()=>{startRound();setTimeout(()=>say(T().warmMe(eggN(dinoById[S.egg.sp].rar)),1800),700)});
window.__dino={DINOS,dinoImg,S,startTrip};
})();
</script>
